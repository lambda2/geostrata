sources:
  - id: global-glofas-flood-hazard-100y
    name: Copernicus GloFAS - Flood Hazard, 100-Year Return Period
    description: Modelled river flood extent and depth for a 100-year return
      period flood, global, about 1 km resolution (JRC flood hazard map).
      Static reference layer. Covers large rivers only (no flash floods, small
      catchments or coastal flooding) and ignores flood defences.
    url: https://ows.globalfloods.eu/glofas-ows/ows.py?SERVICE=WMS&VERSION=1.3.0&LAYERS=FloodHazard100y&STYLES=default&FORMAT=image/png
    data_date: static model output
    tags:
      - hazard map
      - zone inondable
      - return period
      - periode de retour
      - centennale
    i18n:
      fr:
        name: Copernicus GloFAS - Aléa inondation, période de retour 100 ans
        description: Emprise et hauteur d'eau modélisées pour une crue fluviale
          de période de retour 100 ans, à l'échelle mondiale, résolution
          d'environ 1 km (carte d'aléa du JRC). Couche de référence statique. Ne
          couvre que les grands cours d'eau (ni crues éclair, ni petits bassins,
          ni submersion marine) et ignore les ouvrages de protection.
  # Forecast layers. The server needs a TIME value (the date of the forecast run, 00 UTC)
  # and draws a red "not available for this date" notice for a run that is not published
  # yet, so these entries ask for the run of the day before.
  - id: global-glofas-reporting-points
    name: Copernicus GloFAS - Flood Forecast Reporting Points
    description: River points where the latest GloFAS ensemble forecast gives
      more than a 20 % chance of exceeding the 2-year (yellow), 5-year (red) or
      20-year (purple) return period flow within 30 days. Upward triangles
      mean rising flow, downward triangles falling flow, circles steady flow;
      grey dots are the other reporting points. Shows the forecast run of
      yesterday 00 UTC (today's run is published during the day). Large rivers
      only, no flash floods.
    url: https://ows.globalfloods.eu/glofas-ows/ows.py?SERVICE=WMS&VERSION=1.3.0&LAYERS=reportingPoints&STYLES=&FORMAT=image/png&TIME={time}
    time:
      offset_days: -1
    priority: 2
    data_date: daily forecast run, yesterday's run shown
    tags:
      - forecast
      - prevision
      - alert
      - alerte
      - early warning
      - alerte precoce
      - discharge
      - debit
      - daily
      - quotidien
    i18n:
      fr:
        name: Copernicus GloFAS - Points de suivi de la prévision de crue
        description: Points de rivière où la dernière prévision d'ensemble GloFAS
          donne plus de 20 % de chances de dépasser le débit de période de
          retour 2 ans (jaune), 5 ans (rouge) ou 20 ans (violet) dans les
          30 jours. Triangle vers le haut pour un débit en hausse, vers le bas
          pour un débit en baisse, cercle pour un débit stable, les points gris
          sont les autres points de suivi. Affiche la prévision d'hier 00 UTC
          (celle du jour est publiée en cours de journée). Grands cours d'eau
          uniquement, pas de crues éclair.
  - id: global-glofas-flood-summary-days-1-3
    name: Copernicus GloFAS - Flood Forecast Summary, Days 1-3
    description: River reaches where the forecast peak flow of the next 3 days
      exceeds the 20-year (purple), 5-year (red) or 2-year (orange) return
      period, yellow where there is a noticeable chance (over 20 %) of
      exceeding the 2-year level. Thin river lines, zoom in to see them. Shows
      the forecast run of yesterday 00 UTC. Large rivers only.
    url: https://ows.globalfloods.eu/glofas-ows/ows.py?SERVICE=WMS&VERSION=1.3.0&LAYERS=sumAL41EGE&STYLES=default&FORMAT=image/png&TIME={time}
    time:
      offset_days: -1
    data_date: daily forecast run, yesterday's run shown
    tags:
      - forecast
      - prevision
      - alert
      - alerte
      - early warning
      - alerte precoce
      - return period
      - periode de retour
      - daily
      - quotidien
    i18n:
      fr:
        name: Copernicus GloFAS - Synthèse de la prévision de crue, jours 1 à 3
        description: Tronçons de rivière où le pic de débit prévu dans les
          3 prochains jours dépasse la période de retour 20 ans (violet), 5 ans
          (rouge) ou 2 ans (orange), en jaune là où la probabilité de dépasser
          le niveau 2 ans est notable (plus de 20 %). Lignes fines, zoomer pour
          les voir. Affiche la prévision d'hier 00 UTC. Grands cours d'eau
          uniquement.
  - id: global-glofas-flood-summary-days-4-10
    name: Copernicus GloFAS - Flood Forecast Summary, Days 4-10
    description: Same legend as the days 1-3 summary, for forecast days 4 to 10
      - river reaches where the forecast peak flow exceeds the 20-year
      (purple), 5-year (red) or 2-year (orange) return period. Thin river
      lines, zoom in to see them. Shows the forecast run of yesterday 00 UTC.
    url: https://ows.globalfloods.eu/glofas-ows/ows.py?SERVICE=WMS&VERSION=1.3.0&LAYERS=sumAL42EGE&STYLES=default&FORMAT=image/png&TIME={time}
    time:
      offset_days: -1
    data_date: daily forecast run, yesterday's run shown
    tags:
      - forecast
      - prevision
      - alert
      - alerte
      - early warning
      - alerte precoce
      - return period
      - periode de retour
      - daily
      - quotidien
    i18n:
      fr:
        name: Copernicus GloFAS - Synthèse de la prévision de crue, jours 4 à 10
        description: Même légende que la synthèse des jours 1 à 3, pour les
          jours 4 à 10 de la prévision, tronçons où le pic de débit prévu
          dépasse la période de retour 20 ans (violet), 5 ans (rouge) ou 2 ans
          (orange). Lignes fines, zoomer pour les voir. Affiche la prévision
          d'hier 00 UTC.
  - id: global-glofas-rapid-flood-mapping
    name: Copernicus GloFAS - Rapid Flood Mapping (Forecast Flood Extent)
    description: Experimental. Flood extent expected from the current GloFAS
      streamflow forecast, at 1 km, obtained by matching forecast return
      periods with a catalogue of modelled inundation maps. Only drawn for
      basins larger than 5,000 km2 where the forecast exceeds a 10-year return
      period, so the map is empty in most places; flood defences are ignored.
      Shows the forecast run of yesterday 00 UTC.
    url: https://ows.globalfloods.eu/glofas-ows/ows.py?SERVICE=WMS&VERSION=1.3.0&LAYERS=RapidFloodMapping&STYLES=default&FORMAT=image/png&TIME={time}
    time:
      offset_days: -1
    data_date: daily forecast run, yesterday's run shown
    tags:
      - forecast
      - prevision
      - flood extent
      - emprise inondation
      - zone inondee
      - experimental
      - daily
      - quotidien
    i18n:
      fr:
        name: Copernicus GloFAS - Cartographie rapide des crues (emprise prévue)
        description: Expérimental. Emprise d'inondation attendue d'après la
          prévision de débit GloFAS en cours, à 1 km, obtenue en associant les
          périodes de retour prévues à un catalogue de cartes d'inondation
          modélisées. Tracée seulement pour les bassins de plus de 5 000 km2 où
          la prévision dépasse la période de retour 10 ans, la carte est donc
          vide presque partout, les ouvrages de protection sont ignorés.
          Affiche la prévision d'hier 00 UTC.
  - id: global-glofas-rapid-impact-assessment
    name: Copernicus GloFAS - Rapid Impact Assessment (Forecast Flood Impact)
    description: Experimental. Administrative regions coloured by the potential
      impact of the forecast floods - how many people live in the forecast
      flood footprint and how soon the flow peaks. Derived from the rapid
      flood mapping layer, so only regions in basins larger than 5,000 km2
      with a forecast above the 10-year return period are coloured. Shows the
      forecast run of yesterday 00 UTC.
    url: https://ows.globalfloods.eu/glofas-ows/ows.py?SERVICE=WMS&VERSION=1.3.0&LAYERS=RapidImpactAssessment&STYLES=default&FORMAT=image/png&TIME={time}
    time:
      offset_days: -1
    data_date: daily forecast run, yesterday's run shown
    tags:
      - forecast
      - prevision
      - impact
      - population exposed
      - population exposee
      - experimental
      - daily
      - quotidien
    i18n:
      fr:
        name: Copernicus GloFAS - Évaluation rapide d'impact (impact prévu des crues)
        description: Expérimental. Régions administratives colorées selon
          l'impact potentiel des crues prévues, nombre d'habitants dans
          l'emprise d'inondation prévue et délai avant le pic de débit. Dérivée
          de la cartographie rapide des crues, seules les régions des bassins
          de plus de 5 000 km2 où la prévision dépasse la période de retour
          10 ans sont colorées. Affiche la prévision d'hier 00 UTC.
  - id: global-glofas-accumulated-precipitation-10d
    name: Copernicus GloFAS - Forecast Accumulated Precipitation, Next 10 Days
    description: Rainfall expected over the first 10 days of the forecast (mm),
      mean of the ECMWF ensemble that drives GloFAS. Shows the forecast run of
      yesterday 00 UTC. Colour image, not values.
    url: https://ows.globalfloods.eu/glofas-ows/ows.py?SERVICE=WMS&VERSION=1.3.0&LAYERS=AccRainEGE&STYLES=default&FORMAT=image/png&TIME={time}
    time:
      offset_days: -1
    data_date: daily forecast run, yesterday's run shown
    tags:
      - forecast
      - prevision
      - rain
      - pluie
      - rainfall
      - precipitation
      - precipitations
      - ecmwf
      - daily
      - quotidien
    i18n:
      fr:
        name: Copernicus GloFAS - Cumul de précipitations prévu, 10 prochains jours
        description: Pluie attendue sur les 10 premiers jours de la prévision
          (mm), moyenne de l'ensemble ECMWF qui alimente GloFAS. Affiche la
          prévision d'hier 00 UTC. Image colorée et non des valeurs.
  - id: global-glofas-precipitation-probability-50mm
    name: Copernicus GloFAS - Probability of More Than 50 mm of Rain in 10 Days
    description: Probability (%) that the rainfall accumulated over the next
      10 days exceeds 50 mm, from the ECMWF ensemble forecast. Shows the
      forecast run of yesterday 00 UTC. Colour image, not values.
    url: https://ows.globalfloods.eu/glofas-ows/ows.py?SERVICE=WMS&VERSION=1.3.0&LAYERS=EGE_probRgt50&STYLES=default&FORMAT=image/png&TIME={time}
    time:
      offset_days: -1
    data_date: daily forecast run, yesterday's run shown
    tags:
      - forecast
      - prevision
      - rain
      - pluie
      - rainfall
      - precipitation
      - precipitations
      - probability
      - probabilite
      - ecmwf
    i18n:
      fr:
        name: Copernicus GloFAS - Probabilité de plus de 50 mm de pluie en 10 jours
        description: Probabilité (%) que le cumul de pluie des 10 prochains
          jours dépasse 50 mm, d'après la prévision d'ensemble ECMWF. Affiche la
          prévision d'hier 00 UTC. Image colorée et non des valeurs.
  - id: global-glofas-precipitation-probability-150mm
    name: Copernicus GloFAS - Probability of More Than 150 mm of Rain in 10 Days
    description: Probability (%) that the rainfall accumulated over the next
      10 days exceeds 150 mm, from the ECMWF ensemble forecast - the areas at
      risk of extreme rain. Shows the forecast run of yesterday 00 UTC. Colour
      image, not values.
    url: https://ows.globalfloods.eu/glofas-ows/ows.py?SERVICE=WMS&VERSION=1.3.0&LAYERS=EGE_probRgt150&STYLES=default&FORMAT=image/png&TIME={time}
    time:
      offset_days: -1
    data_date: daily forecast run, yesterday's run shown
    tags:
      - forecast
      - prevision
      - rain
      - pluie
      - rainfall
      - precipitation
      - precipitations
      - extreme rain
      - pluies extremes
      - probability
      - probabilite
      - ecmwf
    i18n:
      fr:
        name: Copernicus GloFAS - Probabilité de plus de 150 mm de pluie en 10 jours
        description: Probabilité (%) que le cumul de pluie des 10 prochains
          jours dépasse 150 mm, d'après la prévision d'ensemble ECMWF, les zones
          menacées par des pluies extrêmes. Affiche la prévision d'hier 00 UTC.
          Image colorée et non des valeurs.
  - id: global-glofas-soil-moisture-anomaly
    name: Copernicus GloFAS - Soil Moisture Anomaly
    description: How wet or dry the soil is compared with the ERA5 climate
      mean for the same time of year (deviation divided by the standard
      deviation), at the start of the forecast run. Blue is wetter than usual
      (floods start more easily), brown drier than usual. Shows the run of
      yesterday 00 UTC. Colour image, not values.
    url: https://ows.globalfloods.eu/glofas-ows/ows.py?SERVICE=WMS&VERSION=1.3.0&LAYERS=soilMoistureInstAnomaly&STYLES=default&FORMAT=image/png&TIME={time}
    time:
      offset_days: -1
    data_date: daily, yesterday shown
    tags:
      - soil moisture
      - humidite du sol
      - anomaly
      - anomalie
      - drought
      - secheresse
      - daily
      - quotidien
    i18n:
      fr:
        name: Copernicus GloFAS - Anomalie d'humidité du sol
        description: Humidité du sol comparée à la moyenne climatique ERA5 pour
          la même période de l'année (écart divisé par l'écart type), au début
          de la prévision. En bleu plus humide que la normale (les crues se
          déclenchent plus facilement), en brun plus sec. Affiche la situation
          d'hier 00 UTC. Image colorée et non des valeurs.
  - id: global-glofas-seasonal-outlook-basins
    name: Copernicus GloFAS - Seasonal River Flow Outlook by Basin
    description: Experimental. River basins coloured by the highest probability
      of unusually high (above the 90th percentile, blue) or low (below the
      10th percentile, orange to red) river flow over the next 4 months.
      Shows the forecast of the current month; the server falls back to the
      previous month's forecast until the new one is published.
    url: https://ows.globalfloods.eu/glofas-ows/ows.py?SERVICE=WMS&VERSION=1.3.0&LAYERS=SeasonalOutlookBasins&STYLES=default&FORMAT=image/png&TIME={time}
    time:
      offset_days: 0
      step: month
    data_date: monthly forecast, current month shown
    tags:
      - forecast
      - prevision
      - seasonal
      - saisonnier
      - outlook
      - basin
      - bassin versant
      - drought
      - secheresse
      - low flow
      - etiage
      - monthly
      - mensuel
    i18n:
      fr:
        name: Copernicus GloFAS - Tendance saisonnière des débits par bassin
        description: Expérimental. Bassins versants colorés selon la plus forte
          probabilité de débit inhabituellement élevé (au-dessus du 90e
          centile, bleu) ou faible (sous le 10e centile, orange à rouge) sur
          les 4 prochains mois. Affiche la prévision du mois en cours, le
          serveur revient à celle du mois précédent tant que la nouvelle n'est
          pas publiée.
