# GEBCO Web Map Service (run by the British Oceanographic Data Centre). The LATEST layers follow
# each yearly grid release (GEBCO_2026 at the time of writing). The only named style is "default".
# FORMAT is "image/png; mode=8bit" on purpose: on 2026-11-14 the server answered every image/png,
# image/jpeg, image/gif and image/tiff GetMap with a ServiceException ("Failed to create output PNG
# file"), and only the 8-bit PNG output returned a picture.
defaults:
  type: wms
  category: elevation
  crs: EPSG:4326
  bbox: [-180, -90, 180, 90]
  license: Public domain (GEBCO Grid terms of use; not to be used for navigation, acknowledgement requested)
  attribution: Imagery reproduced from the GEBCO_2026 Grid, GEBCO Compilation Group (2026) GEBCO 2026 Grid (doi:10.5285/4f68d5c7-45eb-f999-e063-7086abc036fa)
  data_date: GEBCO_2026 grid, updated yearly
  tags:
    - gebco
    - bathymetry
    - bathymetrie
    - seafloor
    - fonds marins
    - ocean
    - depth
    - profondeur
    - marine
    - seabed 2030
sources:
  - id: global-gebco-shaded-relief
    name: GEBCO - Bathymetry and Topography, Shaded Relief (15 arc-second)
    description: >-
      Picture of the latest GEBCO global grid with hill shading -
      ocean depths in blues, land heights in greens and browns - at 15
      arc-second resolution (about 450 m). Shows the shape of the seafloor,
      shelves and trenches for coastal and tsunami context. Mostly a
      deep-water compilation with little detail in shallow water; not for
      navigation.
    url: https://wms.gebco.net/mapserv?SERVICE=WMS&VERSION=1.3.0&LAYERS=GEBCO_LATEST&STYLES=default&FORMAT=image/png;%20mode=8bit
    tags:
      - shaded relief
      - relief ombre
      - estompage
      - topography
      - topographie
    i18n:
      fr:
        name: GEBCO - Bathymétrie et topographie, relief ombré (15 secondes d'arc)
        description: >-
          Image de la dernière grille mondiale GEBCO avec ombrage
          du relief - profondeurs océaniques en bleus, altitudes terrestres en
          verts et bruns - à 15 secondes d'arc de résolution (environ 450 m).
          Montre la forme des fonds marins, plateaux et fosses, pour le
          contexte côtier et tsunami. Compilation surtout de grands fonds,
          peu détaillée en eaux peu profondes ; ne pas utiliser pour la
          navigation.
  - id: global-gebco-colour
    name: GEBCO - Bathymetry and Topography, Flat Colour (15 arc-second)
    description: >-
      Picture of the latest GEBCO global grid coloured by elevation
      without hill shading, at 15 arc-second resolution (about 450 m). Flat
      tints make it a calmer background than the shaded version when other
      layers are drawn on top. Not for navigation.
    url: https://wms.gebco.net/mapserv?SERVICE=WMS&VERSION=1.3.0&LAYERS=GEBCO_LATEST_2&STYLES=default&FORMAT=image/png;%20mode=8bit
    tags:
      - colour
      - hypsometric
      - teintes hypsometriques
      - topography
      - topographie
    i18n:
      fr:
        name: GEBCO - Bathymétrie et topographie, teintes à plat (15 secondes d'arc)
        description: >-
          Image de la dernière grille mondiale GEBCO colorée selon
          l'altitude, sans ombrage, à 15 secondes d'arc de résolution (environ
          450 m). Les teintes à plat en font un fond plus discret que la
          version ombrée lorsque d'autres couches sont superposées. Ne pas
          utiliser pour la navigation.
  - id: global-gebco-sub-ice-topography
    name: GEBCO - Shaded Relief with Sub-Ice Topography (15 arc-second)
    description: >-
      Shaded-relief picture of the version of the latest GEBCO
      grid that shows the bedrock under the Greenland and Antarctic ice
      sheets instead of the ice surface, at 15 arc-second resolution.
      Identical to the standard shaded relief elsewhere.
    url: https://wms.gebco.net/mapserv?SERVICE=WMS&VERSION=1.3.0&LAYERS=GEBCO_LATEST_SUB_ICE_TOPO&STYLES=default&FORMAT=image/png;%20mode=8bit
    tags:
      - sub-ice
      - sous la glace
      - greenland
      - groenland
      - antarctica
      - antarctique
      - bedrock
      - socle rocheux
    i18n:
      fr:
        name: GEBCO - Relief ombré avec topographie sous-glaciaire (15 secondes d'arc)
        description: >-
          Image en relief ombré de la version de la dernière grille
          GEBCO qui montre le socle rocheux sous les calottes du Groenland et
          de l'Antarctique au lieu de la surface de la glace, à 15 secondes
          d'arc de résolution. Identique au relief ombré standard ailleurs.
  - id: global-gebco-measured-data-coverage
    name: GEBCO - Seafloor Cells Based on Measured Data (TID grid)
    description: >-
      Black marks the cells of the latest GEBCO grid whose depth
      comes from actual soundings (ship tracks, multibeam surveys, lidar);
      everything interpolated or predicted from satellite gravity stays
      transparent. Overlay it on the bathymetry to judge how far the depths
      can be trusted in an area.
    url: https://wms.gebco.net/mapserv?SERVICE=WMS&VERSION=1.3.0&LAYERS=GEBCO_LATEST_TID&STYLES=default&FORMAT=image/png;%20mode=8bit
    tags:
      - tid
      - source data
      - coverage
      - couverture
      - soundings
      - sondages
      - quality
      - qualite
    i18n:
      fr:
        name: GEBCO - Cellules fondées sur des mesures (grille TID)
        description: >-
          Le noir marque les cellules de la dernière grille GEBCO
          dont la profondeur provient de sondages réels (routes de navires,
          levés multifaisceaux, lidar) ; tout ce qui est interpolé ou prédit
          par gravimétrie satellitaire reste transparent. À superposer à la
          bathymétrie pour juger de la fiabilité des profondeurs dans une
          zone.
