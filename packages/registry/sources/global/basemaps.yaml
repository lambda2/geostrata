- id: global-esa-worldcover-2021
  name: ESA WorldCover 2021 (Global Land Cover, 10 m)
  description: Global land cover map for 2021 at 10 m resolution from Sentinel-1
    and Sentinel-2 (v200), in 11 classes - tree cover, shrubland, grassland,
    cropland, built-up, bare, snow and ice, water, wetland, mangroves, moss and
    lichen - with the official colours. Read directly from the 2651 public
    cloud-optimised tiles (3 x 3 degrees) on the ESA WorldCover AWS bucket
    through a mosaic file - instant at city to country scale, tens of seconds
    for a continent; zoom to your area before adding it, a whole-world view
    opens thousands of files. No data south of 60 S.
  type: vrt
  category: landuse
  url: /vsicurl/https://raw.githubusercontent.com/lambda2/geostrata/main/packages/registry/assets/vrt/esa-worldcover-2021-v200.vrt
  crs: EPSG:4326
  bbox:
    - -180
    - -60
    - 180
    - 84
  tags:
    - esa
    - worldcover
    - occupation du sol
    - landcover
    - land cover
    - lulc
    - foret
    - agriculture
    - cropland
    - cultures
    - built-up
    - bati
    - mangroves
    - sentinel
  license: CC-BY-4.0
  attribution: © ESA WorldCover project 2021 / Contains modified Copernicus
    Sentinel data (2021) processed by ESA WorldCover consortium
  data_date: "2021"
  i18n:
    fr:
      name: ESA WorldCover 2021 (occupation du sol mondiale, 10 m)
      description: Carte mondiale d'occupation du sol 2021 à 10 m de résolution
        issue de Sentinel-1 et Sentinel-2 (v200), en 11 classes - couvert
        arboré, arbustes, prairies, cultures, bâti, sol nu, neige et glace,
        eau, zones humides, mangroves, mousses et lichens - avec les couleurs
        officielles. Lue directement dans les 2651 tuiles publiques optimisées
        pour le cloud (3 x 3 degrés) du dépôt AWS ESA WorldCover via un fichier
        mosaïque - instantané de l'échelle de la ville à celle du pays,
        quelques dizaines de secondes pour un continent ; zoomer sur sa zone
        avant de l'ajouter, une vue du monde entier ouvre des milliers de
        fichiers. Pas de données au sud de 60° S.
