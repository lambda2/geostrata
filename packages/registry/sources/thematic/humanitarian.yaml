- id: global-fieldmaps-adm1
  name: FieldMaps / HDX - Global Regional Administrative Boundaries (ADM1)
  description: Polygons of regions, states, and provinces (administrative level
    ADM1) in cloud-native FlatGeobuf format for humanitarian mapping.
  type: fgb
  category: admin
  url: /vsicurl/https://data.fieldmaps.io/adm1/osm/intl/adm1_polygons.fgb
  crs: EPSG:4326
  bbox:
    - -180
    - -90
    - 180
    - 90
  style_file: admin.qml
  tags:
    - adm1
    - regions
    - provinces
    - fieldmaps
    - hdx
    - humanitaire
    - limites administratives
  license: CC-BY-4.0 / ODbL-1.0
  attribution: © FieldMaps / UN OCHA HDX / OpenStreetMap contributors
  i18n:
    fr:
      name: FieldMaps / HDX - Limites Administratives Régionales Mondiales (ADM1)
      description: Polygones des régions, États et provinces (niveau administratif
        ADM1) au format Cloud-Native FlatGeobuf pour la cartographie
        humanitaire.
