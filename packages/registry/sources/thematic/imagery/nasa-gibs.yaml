# NASA GIBS (Global Imagery Browse Services) WMTS REST tiles in Web Mercator, addressed {z}/{y}/{x}.
# Time-enabled layers use the literal date "default", which the server resolves to the latest
# available day (read from WMTSCapabilities <Default>); no TIME parameter is needed.
# The VIIRS layers use NOAA-20: on 2026-11-14 the Suomi-NPP layers' default date was 12 days old.
defaults:
  type: xyz
  category: imagery
  crs: EPSG:3857
  bbox: [-180, -85.05, 180, 85.05]
  min_zoom: 0
  license: CC0-1.0 (NASA open data policy, no restriction; acknowledgement requested)
  attribution: NASA EOSDIS Global Imagery Browse Services (GIBS)
  tags:
    - nasa
    - gibs
    - satellite
    - imagery
    - imagerie
sources:
  - id: global-gibs-viirs-noaa20-truecolor-daily
    name: NASA GIBS - VIIRS NOAA-20 True Colour, Latest Day (250 m)
    description: >-
      True-colour picture of the whole Earth from the VIIRS
      instrument on NOAA-20, one mosaic per day at about 250 m resolution.
      Always shows the most recent day, which fills in from east to west as
      the satellite passes (early afternoon local time), so part of the globe
      can be black. Clouds are not removed. Good for smoke plumes, large
      floods, dust and storm systems; too coarse for buildings or roads.
    url: https://gibs.earthdata.nasa.gov/wmts/epsg3857/best/VIIRS_NOAA20_CorrectedReflectance_TrueColor/default/default/GoogleMapsCompatible_Level9/{z}/{y}/{x}.jpg
    max_zoom: 9
    data_date: updated daily, latest day shown
    priority: 2
    tags:
      - viirs
      - noaa-20
      - true colour
      - true color
      - couleurs naturelles
      - daily
      - quotidien
      - today
      - aujourd'hui
      - near real time
      - temps reel
      - smoke
      - fumee
      - clouds
      - nuages
    i18n:
      fr:
        name: NASA GIBS - VIIRS NOAA-20 couleurs naturelles, dernier jour (250 m)
        description: >-
          Image en couleurs naturelles de toute la Terre par
          l'instrument VIIRS de NOAA-20, une mosaïque par jour à environ 250 m
          de résolution. Affiche toujours le jour le plus récent, qui se
          remplit d'est en ouest au fil des passages du satellite (début
          d'après-midi, heure locale) ; une partie du globe peut donc être
          noire. Les nuages ne sont pas retirés. Adapté aux panaches de fumée,
          grandes inondations, poussières et systèmes orageux ; trop grossier
          pour le bâti ou les routes.
  - id: global-gibs-modis-terra-truecolor-daily
    name: NASA GIBS - MODIS Terra True Colour, Latest Day (250 m)
    description: >-
      True-colour picture of the whole Earth from the MODIS
      instrument on Terra, one mosaic per day at about 250 m resolution, with
      a mid-morning overpass. Always shows the most recent day, which may be
      incomplete, and clouds are not removed. A second look a few hours apart
      from the VIIRS afternoon image.
    url: https://gibs.earthdata.nasa.gov/wmts/epsg3857/best/MODIS_Terra_CorrectedReflectance_TrueColor/default/default/GoogleMapsCompatible_Level9/{z}/{y}/{x}.jpg
    max_zoom: 9
    data_date: updated daily, latest day shown
    tags:
      - modis
      - terra
      - true colour
      - true color
      - couleurs naturelles
      - daily
      - quotidien
      - near real time
      - temps reel
    i18n:
      fr:
        name: NASA GIBS - MODIS Terra couleurs naturelles, dernier jour (250 m)
        description: >-
          Image en couleurs naturelles de toute la Terre par
          l'instrument MODIS de Terra, une mosaïque par jour à environ 250 m
          de résolution, avec un passage en milieu de matinée. Affiche
          toujours le jour le plus récent, parfois incomplet ; les nuages ne
          sont pas retirés. Un second regard à quelques heures d'intervalle
          de l'image VIIRS de l'après-midi.
  - id: global-gibs-blue-marble
    name: NASA GIBS - Blue Marble, Shaded Relief and Bathymetry (500 m)
    description: >-
      NASA's cloud-free Blue Marble picture of the Earth with
      shaded relief on land and ocean depth shading, at about 500 m
      resolution. A static natural-looking background for world and regional
      overview maps; not suitable beyond roughly 1:2 million.
    url: https://gibs.earthdata.nasa.gov/wmts/epsg3857/best/BlueMarble_ShadedRelief_Bathymetry/default/GoogleMapsCompatible_Level8/{z}/{y}/{x}.jpeg
    max_zoom: 8
    license: Public domain (NASA)
    attribution: NASA Earth Observatory - Blue Marble Next Generation, via NASA GIBS
    data_date: "2004"
    tags:
      - blue marble
      - bluemarble
      - bathymetry
      - bathymetrie
      - relief
      - world
      - monde
      - basemap
      - fond de carte
    i18n:
      fr:
        name: NASA GIBS - Blue Marble, relief ombré et bathymétrie (500 m)
        description: >-
          Image Blue Marble de la Terre sans nuage de la NASA, avec
          relief ombré sur les terres et ombrage des fonds marins, à environ
          500 m de résolution. Fond statique d'aspect naturel pour les cartes
          d'ensemble mondiales et régionales ; inadapté au-delà d'environ
          1:2 millions.
  - id: global-gibs-black-marble-2016
    name: NASA GIBS - Black Marble Night Lights 2016 (500 m)
    description: >-
      Cloud-free composite of the Earth at night in 2016 from the
      VIIRS day/night band, at about 500 m resolution. Shows where people and
      electric lighting are concentrated; a baseline to compare with nightly
      radiance when looking for power outages or displacement.
    url: https://gibs.earthdata.nasa.gov/wmts/epsg3857/best/VIIRS_Black_Marble/default/2016-01-01/GoogleMapsCompatible_Level8/{z}/{y}/{x}.png
    max_zoom: 8
    license: Public domain (NASA)
    attribution: NASA Earth Observatory - Black Marble 2016, via NASA GIBS
    data_date: "2016"
    tags:
      - black marble
      - night lights
      - nightlights
      - lumieres nocturnes
      - nuit
      - night
      - viirs
      - electricity
      - electricite
      - settlements
    i18n:
      fr:
        name: NASA GIBS - Black Marble, lumières nocturnes 2016 (500 m)
        description: >-
          Composition sans nuage de la Terre de nuit en 2016,
          d'après la bande jour/nuit de VIIRS, à environ 500 m de résolution.
          Montre où se concentrent population et éclairage électrique ; état
          de référence à comparer à la radiance nocturne quotidienne pour
          repérer coupures de courant ou déplacements de population.
  - id: global-gibs-city-lights-2012
    name: NASA GIBS - Earth at Night, City Lights 2012 (500 m)
    description: >-
      Cloud-free composite of the Earth at night assembled from
      VIIRS day/night band data of April and October 2012, at about 500 m
      resolution. Older counterpart of the 2016 Black Marble; the pair shows
      how lit areas changed over four years.
    url: https://gibs.earthdata.nasa.gov/wmts/epsg3857/best/VIIRS_CityLights_2012/default/GoogleMapsCompatible_Level8/{z}/{y}/{x}.jpeg
    max_zoom: 8
    license: Public domain (NASA)
    attribution: NASA Earth Observatory / NOAA NGDC - Earth at Night 2012, via NASA GIBS
    data_date: "2012"
    tags:
      - city lights
      - night lights
      - nightlights
      - lumieres nocturnes
      - lumieres des villes
      - nuit
      - night
      - viirs
    i18n:
      fr:
        name: NASA GIBS - La Terre de nuit, lumières des villes 2012 (500 m)
        description: >-
          Composition sans nuage de la Terre de nuit assemblée à
          partir des données de la bande jour/nuit de VIIRS d'avril et
          octobre 2012, à environ 500 m de résolution. Pendant plus ancien du
          Black Marble 2016 ; la paire montre l'évolution des zones éclairées
          en quatre ans.
  - id: global-gibs-viirs-noaa20-dnb-radiance-daily
    name: NASA GIBS - VIIRS NOAA-20 Night Radiance, Latest Night (750 m)
    description: >-
      Night-time radiance measured by the VIIRS day/night band on
      NOAA-20, one mosaic per night at about 750 m resolution, in greyscale.
      Always shows the most recent date, which stays empty over a region
      until that night's passes are processed. Not
      corrected for cloud or moonlight, so a dark town can mean cloud cover
      as well as a power cut; compare several nights and the 2016 Black
      Marble before concluding.
    url: https://gibs.earthdata.nasa.gov/wmts/epsg3857/best/VIIRS_NOAA20_DayNightBand_At_Sensor_Radiance/default/default/GoogleMapsCompatible_Level8/{z}/{y}/{x}.png
    max_zoom: 8
    data_date: updated daily, latest night shown
    tags:
      - viirs
      - noaa-20
      - day night band
      - dnb
      - night lights
      - nightlights
      - lumieres nocturnes
      - nuit
      - radiance
      - power outage
      - coupure de courant
      - blackout
      - daily
      - quotidien
    i18n:
      fr:
        name: NASA GIBS - Radiance nocturne VIIRS NOAA-20, dernière nuit (750 m)
        description: >-
          Radiance nocturne mesurée par la bande jour/nuit de VIIRS
          sur NOAA-20, une mosaïque par nuit à environ 750 m de résolution, en
          niveaux de gris. Affiche toujours la date la plus récente, vide sur une
          région tant que les passages de la nuit ne sont pas traités. Non
          corrigée des nuages ni de la lune : une ville sombre
          peut signaler une couverture nuageuse autant qu'une coupure de
          courant ; comparer plusieurs nuits et le Black Marble 2016 avant de
          conclure.
