# Healthsites.io per-country extracts published on HDX (organisation "healthsites").
# The download URL carries HDX dataset and resource UUIDs, so it cannot be templated: one line per
# country, the shared fields come from `defaults`. URLs read from the HDX API on 2026-11-14
# (package_search fq=organization:healthsites, GeoJSON resource without HXL tags).
# The files mix points and building outlines: `geometry_type: point` (in `defaults`) makes QGIS load
# the point features whatever the first feature is. The 46 countries whose file starts with a
# polygon, left out until the plugin supported `geometry_type`, were added back on 2026-11-14,
# except IOT and NRU whose file holds no point feature at all.
defaults:
  id: "{iso2}-healthsites-facilities"
  name: "Healthsites.io - Health Facilities - {country}"
  description: "Health facilities of {country} from the Healthsites.io global mapping project, built on OpenStreetMap: hospitals, clinics, doctors, dentists, pharmacies and laboratories, with name, amenity, healthcare speciality, operator, beds, staff counts and opening hours when tagged, plus an attribute completeness score. Points and building outlines are mixed in one GeoJSON and QGIS displays the point features only - facilities drawn as outlines (about 8% in Haiti) are not shown, use the HOT health facility polygon layer for those. The whole file is downloaded at load (from a few KB to about 70 MB). Not an official health ministry register."
  type: geojson
  geometry_type: point
  category: health
  crs: EPSG:4326
  license: ODbL-1.0
  attribution: © Healthsites.io, © OpenStreetMap contributors (via HDX)
  data_date: updated by Healthsites.io on HDX, last refresh 2026-09-29
  tags:
    - healthsites
    - health
    - health facilities
    - hospital
    - clinic
    - pharmacy
    - doctors
    - sante
    - hopital
    - hopitaux
    - clinique
    - pharmacie
    - centre de sante
    - dispensaire
    - hdx
    - osm
  i18n:
    fr:
      name: "Healthsites.io - Structures de santé - {country_fr}"
      description: "Structures de santé du pays ({country_fr}) issues du projet mondial Healthsites.io, fondé sur OpenStreetMap : hôpitaux, cliniques, médecins, dentistes, pharmacies et laboratoires, avec nom, type, spécialité, opérateur, lits, effectifs et horaires lorsqu'ils sont renseignés, et un score de complétude des attributs. Points et contours de bâtiments sont mélangés dans un même GeoJSON et QGIS n'affiche que les points - les structures dessinées en contours (environ 8 % en Haïti) ne sont pas affichées, utiliser pour elles la couche de polygones des structures de santé HOT. Le fichier entier est téléchargé au chargement (de quelques Ko à environ 70 Mo). Ce n'est pas un registre officiel du ministère de la santé."
