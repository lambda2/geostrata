        description: "Polygones de bassins versants de la région HydroSHEDS « Afrique » au niveau Pfafstetter 4 sur 12 : grands bassins fluviaux et leurs principaux sous-bassins. Délimités à partir de l'hydrographie SRTM à 15 secondes d'arc (environ 500 m), chaque polygone porte son code Pfafstetter, sa surface, sa surface amont et l'identifiant du bassin aval. Le niveau 4 est lu dans un zip contenant les 12 niveaux ; le shapefile n'a pas d'index spatial et est lu en entier : compter de quelques secondes à une minute au premier chargement."
