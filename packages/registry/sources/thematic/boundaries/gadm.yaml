    name: "GADM 4.1 - Country outline - {country}"
    description: "Administrative boundaries of {country} from GADM 4.1: the national outline (one feature), as polygons with the names and GADM identifiers (GID_0, NAME_0). GADM is a compiled global dataset: handy when no official Common Operational Dataset exists, but boundaries and names can be outdated or differ from the government's. Licence restriction: free for academic and other non-commercial use only, redistribution not allowed. The country GeoPackage (from under 1 MB to about 450 MB for Indonesia) is read in place over HTTP, so large countries are slow to draw."
    layer: ADM_ADM_0
    tags:
      - adm0
      - admin0
      - niveau 0
      - level 0
