      fr:
        name: "GADM 4.1 - Contour du pays - {country_fr}"
        description: "Limites administratives du pays ({country_fr}) issues de GADM 4.1 : le contour national (une entité), en polygones avec les noms et identifiants GADM (GID_0, NAME_0). GADM est une compilation mondiale : pratique en l'absence de jeu de données opérationnel commun (COD) officiel, mais les limites et les noms peuvent être anciens ou différer de ceux du gouvernement. Restriction de licence : usage académique et non commercial uniquement, redistribution interdite. Le GeoPackage du pays (de moins de 1 Mo à environ 450 Mo pour l'Indonésie) est lu à distance en HTTP, l'affichage est donc lent pour les grands pays."
