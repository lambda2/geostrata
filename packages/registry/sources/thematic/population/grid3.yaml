# GRID3 (Geo-Referenced Infrastructure and Demographic Data for Development, CIESIN - Columbia
# University) hosted feature services: https://services3.arcgis.com/BU6Aadhn6tbBEdyk/arcgis/rest/services
# Service list, feature counts and licence texts read on 2026-11-14 (FeatureServer/info/itemInfo).
# Every service returns at most 2,000 features per request; QGIS pages through them for the visible
# extent, so zoom in before loading the settlement extents of a large country.
# Two licences coexist: CC BY-SA 4.0 (settlement extents, Nigeria wards) and CC BY 4.0
# (health facilities, health zones and areas, schools, settlement names, Nigeria points of interest).
# Mayotte and Réunion also have a v3.0 settlement service but are not in the country index.
# Left out after testing: the settlement extents v4 of DRC (1.15 million features) and Nigeria
# (2.5 million) and the DRC and Nigeria road layers. Those services cap the list of object ids at
# 400,000 or 1,000,000 (exceededTransferLimit), and the QGIS ArcGIS provider builds its feature
# index from that list: the layer would silently show a fraction of the data (42 of 452 polygons
# in a test window around Bukavu).
# Not listed: the GRID3 gridded population rasters (no public map service on this server).
defaults:
  type: arcgisfeatureserver
  attribution: © GRID3 / CIESIN, Columbia University, and national partners
  tags:
    - grid3
    - ciesin
    - africa
    - afrique
sources:
  - id: "{iso2}-grid3-settlement-extents"
    for_each_country: [
      AGO, BDI, BEN, BFA, BWA, CAF, CIV, CMR, COG, COM, CPV, DJI, ERI, ETH, GAB, GHA, GIN, GMB,
      GNB, GNQ, KEN, LBR, LSO, MDG, MLI, MOZ, MRT, MUS, MWI, NAM, NER, RWA, SDN, SEN, SHN, SLE,
      SOM, SSD, STP, SWZ, SYC, TCD, TGO, TZA, UGA, ZAF, ZMB, ZWE
    ]
    name: "GRID3 - Settlement Extents v3.0 - {country}"
    description: "Outlines of every settlement of {country} derived from building footprints: built-up areas, small settlement areas and hamlets as polygons, with settlement type, building count, building area and detection probability. Shows where people live, including villages missing from OpenStreetMap, which helps to plan assessments and count settlements in an area. From a few hundred polygons (islands) to more than 900,000 (Ethiopia): the server returns 2,000 features per request, so zoom to a district before loading a large country."
    category: population
    url: https://services3.arcgis.com/BU6Aadhn6tbBEdyk/arcgis/rest/services/GRID3_{ISO3}_Settlement_Extents_v3_0/FeatureServer/0
    style_file: buildings.qml
    license: CC-BY-SA-4.0
    data_date: version 3.0, published 2024
    priority: 2
    tags:
      - settlement
      - settlement extents
      - built-up area
      - villages
      - hamlets
      - localites
      - zones baties
      - tache urbaine
      - villages
      - hameaux
      - population
      - "{country}"
      - "{country_fr}"
    i18n:
      fr:
        name: "GRID3 - Emprises des localités v3.0 - {country_fr}"
        description: "Contours de toutes les localités du pays ({country_fr}) dérivés des empreintes de bâtiments : zones bâties, petites localités et hameaux en polygones, avec type de localité, nombre et surface de bâtiments et probabilité de détection. Montre où vivent les habitants, y compris dans les villages absents d'OpenStreetMap, utile pour planifier des évaluations et dénombrer les localités d'une zone. De quelques centaines de polygones (îles) à plus de 900 000 (Éthiopie) : le serveur renvoie 2 000 entités par requête, zoomer sur un district avant de charger un grand pays."
