# GADM 4.1 administrative areas, one GeoPackage per country (University of California, Davis).
# Every GeoPackage holds one layer per administrative level (ADM_ADM_0 ... ADM_ADM_5); the number of
# levels differs by country, so there is one template per level and each lists only the countries
# whose GeoPackage really contains that layer. Lists read on 2026-11-14 by opening the 236 files
# with OGR through /vsicurl/ (HKG and MAC answer 404: GADM files them under China).
# The GeoPackage is streamed with HTTP range requests (type fgb = any OGR file read in place),
# not downloaded: only the SQLite pages of the requested layer are fetched.
# LICENCE: GADM is NOT open data. Free for academic and other non-commercial use only;
# redistribution and commercial use need prior permission (https://gadm.org/license.html).
defaults:
  type: fgb
  category: admin
  crs: EPSG:4326
  url: /vsicurl/https://geodata.ucdavis.edu/gadm/gadm4.1/gpkg/gadm41_{ISO3}.gpkg
  style_file: admin.qml
  license: GADM licence - free for academic and other non-commercial use only;
    redistribution and commercial use are not allowed without prior permission
    (https://gadm.org/license.html). Austria is CC BY-SA 2.0
  attribution: © GADM 4.1 (gadm.org), University of California, Davis
  data_date: GADM version 4.1, released July 2022
  priority: 0
  tags:
    - gadm
    - boundaries
    - administrative boundaries
    - admin
    - limites administratives
    - frontieres
    - decoupage administratif
    - non-commercial
    - "{country}"
    - "{country_fr}"
