# Global Forest Watch raster tiles (World Resources Institute).
# The URLs name a dataset version on purpose: the `latest` alias answers with an HTTP 307 redirect
# that the QGIS XYZ tile loader does not follow (blank layer, checked in QGIS 4.2.3). When a new
# version is published (https://data-api.globalforestwatch.org/dataset/umd_tree_cover_loss lists
# them), bump v1.13 below.
defaults:
  type: xyz
  category: landuse
  crs: EPSG:3857
  bbox: [-180, -85.05, 180, 85.05]
  min_zoom: 0
  max_zoom: 12
  license: CC-BY-4.0
  attribution: "Source: Hansen/UMD/Google/USGS/NASA, accessed through Global Forest Watch"
  tags:
    - gfw
    - global forest watch
    - hansen
    - umd
    - forest
    - foret
    - tree cover
    - couvert forestier
    - couvert arbore
    - landsat
sources:
  - id: global-gfw-tree-cover-loss
    name: Global Forest Watch - Tree Cover Loss (Hansen/UMD, 30 m)
    description: >-
      Yearly tree cover loss since 2001 detected on Landsat imagery
      at 30 m resolution, drawn in red over a transparent background. Tree
      cover means vegetation taller than 5 m, plantations included; loss covers
      logging, fire, storm damage and disease, so it is not the same as
      deforestation. Overlay only, the year of loss cannot be queried.
    url: https://tiles.globalforestwatch.org/umd_tree_cover_loss/v1.13/dynamic/{z}/{x}/{y}.png
    data_date: GFW dataset version v1.13 (yearly loss from 2001), new version each year
    tags:
      - tree cover loss
      - deforestation
      - deforestation annuelle
      - perte de couvert forestier
      - logging
      - coupe
    i18n:
      fr:
        name: Global Forest Watch - Perte de couvert arboré (Hansen/UMD, 30 m)
        description: >-
          Perte annuelle de couvert arboré depuis 2001, détectée sur
          les images Landsat à 30 m de résolution et dessinée en rouge sur fond
          transparent. Le couvert arboré désigne toute végétation de plus de
          5 m, plantations comprises ; la perte inclut coupes, incendies,
          tempêtes et maladies et ne correspond donc pas uniquement à la
          déforestation. Couche de superposition, l'année de perte n'est pas
          interrogeable.
  - id: global-gfw-tree-cover-density-2000
    name: Global Forest Watch - Tree Cover 2000, Canopy Density over 30 % (30 m)
    description: >-
      Extent of tree cover in the year 2000 where canopy density
      exceeds 30 %, from Landsat at 30 m resolution, in plain green over a
      transparent background. Baseline for the tree cover loss layer; shows any
      vegetation taller than 5 m, natural forest and plantations alike.
    url: https://tiles.globalforestwatch.org/umd_tree_cover_density_2000/v1.8/tcd_30/{z}/{x}/{y}.png
    data_date: "2000"
    tags:
      - tree cover density
      - canopy
      - canopee
      - densite du couvert
      - "2000"
    i18n:
      fr:
        name: Global Forest Watch - Couvert arboré 2000, densité de canopée supérieure à 30 % (30 m)
        description: >-
          Étendue du couvert arboré en 2000 là où la densité de
          canopée dépasse 30 %, d'après Landsat à 30 m de résolution, en
          vert uni sur fond transparent. Sert d'état de référence à la
          couche de perte de couvert ; montre toute végétation de plus de 5 m,
          forêts naturelles comme plantations.
