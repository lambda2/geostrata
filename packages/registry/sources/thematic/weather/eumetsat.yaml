sources:
  - id: global-eumetsat-msg-ir108
    name: EUMETSAT - Meteosat Infrared 10.8 µm (Europe, Africa)
    description: Latest Meteosat (0° position) thermal infrared image, in grey
      levels where cold high cloud tops are white - the standard picture to
      follow cloud systems and storms day and night. Full disc over Europe,
      Africa and the Atlantic, 3 km at nadir, a new image every 15 minutes. The
      latest image is shown by default; QGIS temporal controls can step back in
      time.
    url: https://view.eumetsat.int/geoserver/wms?SERVICE=WMS&VERSION=1.3.0&LAYERS=msg_fes:ir108&STYLES=raster&FORMAT=image/png
    bbox:
      - -77
      - -77
      - 77
      - 77
    data_date: every 15 minutes, latest image shown by default
    tags:
      - infrared
      - infrarouge
      - cloud
      - nuage
      - africa
      - afrique
      - europe
    i18n:
      fr:
        name: EUMETSAT - Meteosat infrarouge 10,8 µm (Europe, Afrique)
        description: Dernière image infrarouge thermique de Meteosat (position
          0°), en niveaux de gris où les sommets nuageux froids et élevés sont
          blancs, l'image de référence pour suivre les systèmes nuageux et les
          orages de jour comme de nuit. Disque complet sur l'Europe, l'Afrique et
          l'Atlantique, 3 km au nadir, une nouvelle image toutes les 15 minutes.
          La dernière image est affichée par défaut, le contrôleur temporel de
          QGIS permet de remonter dans le temps.
  - id: global-eumetsat-iodc-ir108
    name: EUMETSAT - Meteosat Infrared 10.8 µm (Indian Ocean)
    description: Latest Meteosat Indian Ocean (45.5°E position) thermal
      infrared image, in grey levels where cold high cloud tops are white.
      Full disc over East Africa, the Middle East, South and Central Asia and
      the Indian Ocean, 3 km at nadir, a new image every 15 minutes. The latest
      image is shown by default.
    url: https://view.eumetsat.int/geoserver/wms?SERVICE=WMS&VERSION=1.3.0&LAYERS=msg_iodc:ir108&STYLES=raster&FORMAT=image/png
    bbox:
      - -35.5
      - -77
      - 118.5
      - 77
    data_date: every 15 minutes, latest image shown by default
    tags:
      - infrared
      - infrarouge
      - cloud
      - nuage
      - indian ocean
      - ocean indien
      - asia
      - asie
    i18n:
      fr:
        name: EUMETSAT - Meteosat infrarouge 10,8 µm (océan Indien)
        description: Dernière image infrarouge thermique de Meteosat océan Indien
          (position 45,5°E), en niveaux de gris où les sommets nuageux froids et
          élevés sont blancs. Disque complet sur l'Afrique de l'Est, le
          Moyen-Orient, l'Asie du Sud et centrale et l'océan Indien, 3 km au
          nadir, une nouvelle image toutes les 15 minutes. La dernière image est
          affichée par défaut.
  - id: global-eumetsat-msg-rain-rate-h60b
    name: EUMETSAT H SAF - Satellite Rain Rate (Europe, Africa)
    description: Latest instantaneous precipitation rate (mm/h) estimated by
      blending Meteosat infrared with microwave sounders (H SAF product H60B),
      over Europe, Africa and the Atlantic, about 3 to 5 km, every 15 minutes.
      Satellite estimate, weakest for light or orographic rain. The latest
      image is shown by default.
    url: https://view.eumetsat.int/geoserver/wms?SERVICE=WMS&VERSION=1.3.0&LAYERS=msg_fes:h60b&STYLES=msg_h60b_h63&FORMAT=image/png
    bbox:
      - -77
      - -77
      - 77
      - 77
    data_date: every 15 minutes, latest image shown by default
    tags:
      - rain
      - pluie
      - rainfall
      - precipitation
      - precipitations
      - hsaf
      - africa
      - afrique
    i18n:
      fr:
        name: EUMETSAT H SAF - Taux de pluie par satellite (Europe, Afrique)
        description: Dernier taux de précipitation instantané (mm/h) estimé en
          combinant l'infrarouge Meteosat et les sondeurs micro-ondes (produit H
          SAF H60B), sur l'Europe, l'Afrique et l'Atlantique, environ 3 à 5 km,
          toutes les 15 minutes. Estimation satellitaire, moins fiable pour les
          pluies faibles ou orographiques. La dernière image est affichée par
          défaut.
  - id: global-eumetsat-mtg-lightning-afa
    name: EUMETSAT - MTG Lightning, Accumulated Flash Area
    description: Lightning activity seen by the Lightning Imager on Meteosat
      Third Generation - area covered by flashes accumulated over the latest
      period, over Europe, Africa and the Atlantic, about 4.5 km at nadir, updated
      every 5 minutes. Shows where thunderstorms are active right now. The
      latest image is shown by default.
    url: https://view.eumetsat.int/geoserver/wms?SERVICE=WMS&VERSION=1.3.0&LAYERS=mtg_fd:li_afa&STYLES=mtg_li_afa&FORMAT=image/png
    bbox:
      - -70
      - -70
      - 70
      - 70
    data_date: every 5 minutes, latest image shown by default
    tags:
      - lightning
      - foudre
      - eclair
      - thunderstorm
      - orage
      - mtg
    i18n:
      fr:
        name: EUMETSAT - Foudre MTG, surface cumulée des éclairs
        description: Activité électrique vue par l'imageur d'éclairs de Meteosat
          Troisième Génération, surface couverte par les éclairs cumulés sur la
          dernière période, sur l'Europe, l'Afrique et l'Atlantique, environ
          4,5 km au nadir, mise à jour toutes les 5 minutes. Montre où les orages
          sont actifs à l'instant. La dernière image est affichée par défaut.
