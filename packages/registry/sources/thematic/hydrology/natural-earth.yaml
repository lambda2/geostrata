        name: Natural Earth - Fleuves et axes des lacs (1:10m)
        description: >-
          Principaux fleuves et rivières du monde et lignes d'axe à
          travers les lacs à l'échelle 1:10 millions, en lignes nommées avec un
          rang d'échelle pour filtrer. Petit fichier (environ 2 Mo) chargé en
          quelques secondes ; destiné aux cartes d'ensemble du pays au
          continent, trop généralisé en dessous d'environ 1:1 million.
