name: Publish Catalog & QGIS Plugin Repository to GitHub Pages

on:
  push:
    branches: [main]
  # Weekly refresh so installed plugins get new generated layers and current link statuses without a commit.
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build-static-site:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: packages/registry/package-lock.json

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Install registry dependencies
        working-directory: packages/registry
        run: npm ci

      - name: Ingest & Build catalog.sqlite
        working-directory: packages/registry
        run: npm run ingest && npm run build

      # Writes dist/health.json. Exits 1 when it finds dead links: that must be
      # visible (summary + warning below) but never blocks publishing.
      - name: Check endpoints availability
        id: healthcheck
        working-directory: packages/registry
        run: |
          set +e
          npm run healthcheck > "$RUNNER_TEMP/healthcheck.log" 2>&1
          code=$?
          set -e
          grep -vE '^\[OK\]' "$RUNNER_TEMP/healthcheck.log" || true
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"

      # Second build: bakes health.json into catalog.sqlite / catalog.json
      # (health_status, health_checked_at) and refreshes the gzip and manifest.
      - name: Rebuild catalog.sqlite with health status
        working-directory: packages/registry
        run: npm run build

      - name: Healthcheck summary
        run: |
          python3 .github/workflows/scripts/health-summary.py \
            packages/registry/dist/health.json "$GITHUB_STEP_SUMMARY" \
            "${{ steps.healthcheck.outputs.exit_code }}"

      - name: Package QGIS plugin ZIP & plugins.xml
        env:
          GEOSTRATA_BASE_URL: ${{ steps.pages.outputs.base_url }}
        run: python3 packages/qgis-plugin/scripts/package_plugin.py

      - name: Assemble _site directory for GitHub Pages
        run: python3 packages/website/build_site.py

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

  deploy-pages:
    needs: build-static-site
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
