# HOT OSM per-country exports (Humanitarian OpenStreetMap Team raw-data-api bucket, also published on HDX).
# One templated entry per theme, expanded for every country whose file answered an HTTP range
# request on 2026-11-14 and holds at least one feature (empty exports are left out).
# Archives above 150 MB are left out: the plugin streams the whole zip and QGIS would freeze for minutes
# (use the Overpass recipes or the country's own sources there).
# To refresh the lists, re-probe the URL for every ISO3 of assets/polygons/country-index.json.
defaults:
  type: archive
  crs: EPSG:4326
  license: ODbL-1.0
  attribution: © OpenStreetMap contributors, exported by the Humanitarian OpenStreetMap Team (HOT)
  data_date: periodic OSM snapshot by HOT, most files exported May 2026 (a few date from 2024-2025)
  tags:
    - osm
    - openstreetmap
    - hot
    - hotosm
    - hdx
    - humanitarian
    - humanitaire
    - export
sources:
  - id: "{iso2}-hotosm-roads"
    name: "HOT OSM Export - Roads - {country}"
    description: "All OpenStreetMap roads, tracks and paths of {country} (highway=*) as lines, with name, class, surface, smoothness, width, lanes, oneway and bridge attributes. Country-wide snapshot exported by the Humanitarian OpenStreetMap Team, usable offline once loaded; completeness depends on local OSM mapping. The whole zipped GeoPackage is streamed: a few seconds for small countries, slow first load and slow pan for large ones (archives exceed 1 GB for the largest countries)."
    category: transport
    url: https://s3.dualstack.us-east-1.amazonaws.com/production-raw-data-api/ISO3/{ISO3}/roads/lines/hotosm_{iso3}_roads_lines_gpkg.zip
    archive_target: hotosm_{iso3}_roads_lines_gpkg.gpkg
    style_file: transport.qml
    priority: 2
