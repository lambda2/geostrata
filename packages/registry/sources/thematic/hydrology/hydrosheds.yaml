# HydroSHEDS vector products (WWF / McGill University), one zipped shapefile per continental region.
# Region codes used by HydroSHEDS: af ar as au eu gr na sa si.
# The shapefiles carry no spatial index, so GDAL reads a whole file through /vsizip//vsicurl/
# before drawing: the sizes quoted in the descriptions translate directly into waiting time.
defaults:
  type: archive
  category: hydrography
  crs: EPSG:4326
  license: HydroSHEDS license agreement - free for scientific, educational and commercial use, attribution required (see the HydroSHEDS Technical Documentation for redistribution terms)
  attribution: HydroSHEDS (www.hydrosheds.org) - Lehner, B. and Grill, G. (2013), Hydrological Processes 27(15)
  data_date: v1.0 (2013-2019), derived from SRTM 2000
  tags:
    - hydrosheds
    - wwf
    - hydrology
    - hydrologie
    - hydrography
    - hydrographie
    - srtm
sources:
  - id: africa-hydrosheds-rivers
    name: "HydroRIVERS - River Network - Africa"
    description: "Vector river network of the HydroSHEDS Africa region derived from the 15 arc-second (about 500 m) SRTM hydrography: 1.5 million river reaches draining at least 10 km2 or carrying 0.1 m3/s, each with length, upstream area, Strahler order and modelled average discharge. Lines follow the terrain model, not surveyed banks, so expect offsets of a few hundred metres. 108 MB zipped shapefile without spatial index, read in full on every redraw: slow first load (a minute or more), download it for sustained work."
    url: https://data.hydrosheds.org/file/HydroRIVERS/HydroRIVERS_v10_af_shp.zip
    archive_target: HydroRIVERS_v10_af_shp/HydroRIVERS_v10_af.shp
    bbox: [-18, -35, 54.5, 37.5]
    tags:
      - hydrorivers
      - rivers
      - river network
      - rivieres
      - fleuves
      - cours d'eau
      - reseau hydrographique
      - discharge
      - debit
      - strahler
      - africa
      - afrique
    i18n:
      fr:
        name: "HydroRIVERS - Réseau hydrographique - Afrique"
        description: "Réseau hydrographique vectoriel de la région HydroSHEDS « Afrique », dérivé de l'hydrographie SRTM à 15 secondes d'arc (environ 500 m) : 1,5 million tronçons drainant au moins 10 km2 ou débitant 0,1 m3/s, avec longueur, surface amont, ordre de Strahler et débit moyen modélisé. Les lignes suivent le modèle de terrain et non les berges levées : décalages de quelques centaines de mètres possibles. Shapefile zippé de 108 Mo sans index spatial, relu en entier à chaque rafraîchissement : premier chargement lent (une minute ou plus), à télécharger pour un travail prolongé."
  - id: africa-hydrosheds-basins-l4
    name: "HydroBASINS - Watersheds Level 4 - Africa"
    description: "Watershed polygons of the HydroSHEDS Africa region at Pfafstetter level 4 of 12: large river basins and their main sub-basins. Delineated from the 15 arc-second (about 500 m) SRTM hydrography, each polygon carries its Pfafstetter code, area, upstream area and the id of the next basin downstream. Level 4 is read from inside a zip that holds all 12 levels; the shapefile has no spatial index and is read in full, so allow some seconds to a minute on first load."
    url: https://data.hydrosheds.org/file/hydrobasins/standard/hybas_af_lev01-12_v1c.zip
    archive_target: hybas_af_lev04_v1c.shp
